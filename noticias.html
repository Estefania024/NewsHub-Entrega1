<!DOCTYPE html>

</head>
<body>
  <header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">NewsHub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="noticias.html">Noticias</a></li>
            <li class="nav-item"><a class="nav-link" href="detalle.html?id=1">Detalle</a></li>

            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
      <div>
        <h1>Catálogo de Noticias</h1>
        <p class="text-muted mb-0">Busca y filtra las noticias disponibles.</p>

        <label for="searchInput" class="visually-hidden">Buscar noticia</label>

      </div>
      <div class="col-md-4">
        <label for="categoryFilter" class="visually-hidden">Categoría</label>
        <select id="categoryFilter" class="form-select">
          <option value="">Todas las categorías</option>
          <option value="Educación">Educación</option>
          <option value="Tecnología">Tecnología</option>
          <option value="Turismo">Turismo</option>

      </div>
    </div>

    <div id="newsGrid" class="row g-4"></div>

  <footer class="site-footer">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
      <span>© 2026 NewsHub — Plataforma Web de Noticias</span>
      <span>Inicio | Noticias | Contacto | Política de privacidad</span>
