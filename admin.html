<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewsHub | Gestión de noticias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">NewsHub</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="noticias.html">Volver a noticias</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <h1>Gestión básica de noticias</h1>
    <p class="text-muted">Mini CRUD de demostración: crear y eliminar noticias desde la interfaz.</p>

    <form id="newsForm" class="card card-body shadow-sm mb-5">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="newsTitle">Título *</label>
          <input id="newsTitle" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="newsCategory">Categoría *</label>
          <select id="newsCategory" class="form-select" required>
            <option value="">Seleccione...</option>
            <option>Educación</option>
            <option>Tecnología</option>
            <option>Turismo</option>
            <option>Comercio</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label" for="newsDescription">Descripción *</label>
          <textarea id="newsDescription" class="form-control" rows="3" required></textarea>
        </div>
        <div class="col-12">
          <label class="form-label" for="newsContent">Contenido *</label>
          <textarea id="newsContent" class="form-control" rows="5" required></textarea>
        </div>
        <div class="col-12">
          <button class="btn btn-primary" type="submit">Crear noticia</button>
        </div>
      </div>
    </form>

    <div id="adminNewsList" class="row g-4"></div>
  </main>

  <script src="js/app.js"></script>
  <script>setupAdmin();</script>
</body>
</html>
